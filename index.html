<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LEAP Basic 英単語クイズ</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --correct: #16a34a;
      --wrong: #dc2626;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .select-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #fff;
      color: var(--text-main);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn:active {
      background-color: var(--primary-hover);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: bold;
    }

    .timer-box {
      color: var(--wrong);
      font-size: 1.2rem;
    }

    .score-box {
      color: var(--primary);
      transition: color 0.3s;
    }

    .score-box.minus {
      color: var(--wrong);
    }

    .combo-box {
      color: #d97706;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 100%;
      transition: width 1s linear;
    }

    .word-card {
      text-align: center;
      padding: 30px 10px;
      background: #f1f5f9;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .word-num {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .word-text {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      word-break: break-word;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      padding: 16px;
      font-size: 1.05rem;
      text-align: left;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-main);
      font-weight: 500;
    }

    .option-btn:active {
      background-color: #f8fafc;
    }

    .option-btn.correct {
      background-color: #dcfce7 !important;
      border-color: var(--correct) !important;
      color: var(--correct) !important;
    }

    .option-btn.wrong {
      background-color: #fee2e2 !important;
      border-color: var(--wrong) !important;
      color: var(--wrong) !important;
    }

    .result-summary {
      text-align: center;
      margin-bottom: 20px;
    }

    .result-score {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }

    .result-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .review-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
      text-align: left;
    }

    .review-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-word {
      font-weight: bold;
    }

    .review-meaning {
      color: var(--text-sub);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. 設定・スタート画面 -->
  <div id="start-screen">
    <h1>LEAP Basic 単語テスト</h1>

    <div class="select-group">
      <label for="mode-select">出題モードの選択</label>
      <select id="mode-select">
        <option value="eng_to_jap">英語 → 日本語（英単語を見て日本語訳を選ぶ）</option>
        <option value="jap_to_eng">日本語 → 英語（日本語訳を見て英単語を選ぶ）</option>
      </select>
    </div>
    
    <div class="select-group">
      <label for="part-select">Partの選択</label>
      <select id="part-select">
        <!-- JSで動的生成 -->
      </select>
    </div>

    <div class="select-group">
      <label for="week-select">Weekの選択</label>
      <select id="week-select">
        <!-- JSで動的生成 -->
      </select>
    </div>

    <button class="btn" id="start-btn">テスト開始 (60秒)</button>
  </div>

  <!-- 2. クイズ画面 -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-header">
      <div class="timer-box">⏱ <span id="timer">60</span>s</div>
      <div class="combo-box"><span id="combo">0</span> Combo</div>
      <div class="score-box" id="score-box"><span id="score">0</span> pt</div>
    </div>
    
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="timer-bar"></div>
    </div>

    <div class="word-card">
      <div class="word-num" id="word-num">No. ---</div>
      <div class="word-text" id="word-text">word</div>
    </div>

    <div class="options-grid" id="options-container">
      <!-- 選択肢ボタン4つ -->
    </div>
  </div>

  <!-- 3. 結果画面 -->
  <div id="result-screen" class="hidden">
    <h1>タイムアップ！</h1>
    
    <div class="result-summary">
      <div>スコア</div>
      <div class="result-score" id="final-score">0</div>
    </div>

    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-correct">0 / 0</div>
        <div class="stat-label">正答数 / 解答数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-accuracy">0%</div>
        <div class="stat-label">正答率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-maxcombo">0</div>
        <div class="stat-label">最大コンボ</div>
      </div>
    </div>

    <div id="review-container" class="hidden">
      <label>要復習単語（間違えた問題）</label>
      <div class="review-list" id="review-list"></div>
    </div>

    <button class="btn" id="restart-btn">もう一度挑戦する</button>
  </div>
</div>

    { p: "巻末+α", wCount: 5, startNo: 1, wordsPerWeek: [42, 42, 40, 41, 35] }
  ];

  const dictKeys = Object.keys(wordDict);
  let dictIdx = 0;

  metaConfig.forEach(cfg => {
    let currentNo = cfg.startNo;
    for (let w = 1; w <= cfg.wCount; w++) {
      const count = cfg.wordsPerWeek[w - 1] || 40;
      const weekStr = `Week ${w}`;
      for (let i = 0; i < count; i++) {
        if (dictIdx < dictKeys.length) {
          const eng = dictKeys[dictIdx];
          const jap = wordDict[eng];
          rawVocabularyData.push([currentNo, eng, jap, cfg.p, weekStr]);
          dictIdx++;
          currentNo++;
        }
      }
    }
  });
}
buildMasterData();

// --- グローバル状態 ---
let selectedVocabulary = [];
let quizMode = "eng_to_jap";
let currentQuestionIndex = 0;
let currentQuestion = null;
let timer = 60;
let timerInterval = null;
let score = 0;
let combo = 0;
let maxCombo = 0;
let totalAnswered = 0;
let totalCorrect = 0;
let wrongList = [];
let questionStartTime = 0;

// DOM要素
const startScreen = document.getElementById('start-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');

const modeSelect = document.getElementById('mode-select');
const partSelect = document.getElementById('part-select');
const weekSelect = document.getElementById('week-select');
const startBtn = document.getElementById('start-btn');

const timerEl = document.getElementById('timer');
const scoreBoxEl = document.getElementById('score-box');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const timerBar = document.getElementById('timer-bar');

const wordNumEl = document.getElementById('word-num');
const wordTextEl = document.getElementById('word-text');
const optionsContainer = document.getElementById('options-container');

// 初期化（ドロップダウン生成）
function initSelects() {
  const parts = ["すべて", ...new Set(rawVocabularyData.map(item => item[3]))];
  partSelect.innerHTML = parts.map(p => `<option value="${p}">${p}</option>`).join('');
  
  updateWeekSelect();
  partSelect.addEventListener('change', updateWeekSelect);
}

function updateWeekSelect() {
  const selectedPart = partSelect.value;
  let weeks = [];
  if (selectedPart === "すべて") {
    weeks = [...new Set(rawVocabularyData.map(item => item[4]))];
  } else {
    weeks = [...new Set(rawVocabularyData.filter(item => item[3] === selectedPart).map(item => item[4]))];
  }

  weeks.sort((a, b) => {
    const numA = parseInt(a.replace('Week ', ''));
    const numB = parseInt(b.replace('Week ', ''));
    return numA - numB;
  });

  let options = '<option value="すべて">すべてのWeek</option>';
  weeks.forEach(w => {
    options += `<option value="${w}">${w}</option>`;
  });
  weekSelect.innerHTML = options;
}

// テスト開始
startBtn.addEventListener('click', () => {
  quizMode = modeSelect.value;
  const pVal = partSelect.value;
  const wVal = weekSelect.value;

  selectedVocabulary = rawVocabularyData.filter(item => {
    const matchPart = (pVal === "すべて" || item[3] === pVal);
    const matchWeek = (wVal === "すべて" || item[4] === wVal);
    return matchPart && matchWeek;
  });

  if (selectedVocabulary.length < 4) {
    alert("選択された範囲の単語数が少なすぎます（4語以上必要です）。");
    return;
  }

  shuffleArray(selectedVocabulary);

  // 状態リセット
  timer = 60;
  score = 0;
  combo = 0;
  maxCombo = 0;
  totalAnswered = 0;
  totalCorrect = 0;
  wrongList = [];
  currentQuestionIndex = 0;

  // UI切り替え
  startScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');

  scoreEl.textContent = score;
  comboEl.textContent = combo;
  timerEl.textContent = timer;
  timerBar.style.width = '100%';

  startTimer();
  nextQuestion();
});

// タイマー
function startTimer() {
  const startTime = Date.now();
  const totalDuration = 60000;

  timerInterval = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, totalDuration - elapsed);
    
    timer = Math.ceil(remaining / 1000);
    timerEl.textContent = timer;

    const percentage = (remaining / totalDuration) * 100;
    timerBar.style.width = percentage + '%';

    if (remaining <= 0) {
      clearInterval(timerInterval);
      endQuiz();
    }
  }, 200);
}

// 問題セット
function nextQuestion() {
  if (currentQuestionIndex >= selectedVocabulary.length) {
    shuffleArray(selectedVocabulary);
    currentQuestionIndex = 0;
  }

  currentQuestion = selectedVocabulary[currentQuestionIndex];
  currentQuestionIndex++;

  wordNumEl.textContent = `No. ${currentQuestion[0]} (${currentQuestion[3]} ${currentQuestion[4]})`;

  const questionPrompt = (quizMode === "eng_to_jap") ? currentQuestion[1] : currentQuestion[2];
  const correctAnswer = (quizMode === "eng_to_jap") ? currentQuestion[2] : currentQuestion[1];

  wordTextEl.textContent = questionPrompt;

  const options = [correctAnswer];
  const targetIndex = (quizMode === "eng_to_jap") ? 2 : 1;
  const otherWords = rawVocabularyData.filter(item => item[targetIndex] !== correctAnswer);
  shuffleArray(otherWords);

  for (let i = 0; i < 3; i++) {
    options.push(otherWords[i][targetIndex]);
  }
  shuffleArray(options);

  optionsContainer.innerHTML = '';
  options.forEach(optText => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = optText;
    btn.addEventListener('click', () => handleAnswer(btn, optText, correctAnswer));
    optionsContainer.appendChild(btn);
  });

  questionStartTime = Date.now();
}

// 解答処理
function handleAnswer(selectedBtn, selectedText, correctAnswer) {
  const buttons = optionsContainer.querySelectorAll('.option-btn');
  buttons.forEach(b => b.style.pointerEvents = 'none');

  const isCorrect = (selectedText === correctAnswer);
  const timeTaken = (Date.now() - questionStartTime) / 1000;

  totalAnswered++;

  if (isCorrect) {
    totalCorrect++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;

    selectedBtn.classList.add('correct');

    const speedBonus = Math.max(0, Math.round((5 - timeTaken) * 100)); 
    const comboMultiplier = Math.min(2.0, 1.0 + (combo - 1) * 0.1);
    const addedScore = Math.round((500 + speedBonus) * comboMultiplier);

    score += addedScore;
  } else {
    combo = 0;
    selectedBtn.classList.add('wrong');
    
    // 不正解で -300 pt（最低 0 pt）
    const penalty = 300;
    score = Math.max(0, score - penalty);

    scoreBoxEl.classList.add('minus');
    setTimeout(() => {
      scoreBoxEl.classList.remove('minus');
    }, 500);

    buttons.forEach(b => {
      if (b.textContent === correctAnswer) {
        b.classList.add('correct');
      }
    });

    if (!wrongList.some(item => item[0] === currentQuestion[0] && item[3] === currentQuestion[3])) {
      wrongList.push(currentQuestion);
    }
  }

  scoreEl.textContent = score;
  comboEl.textContent = combo;

  setTimeout(() => {
    nextQuestion();
  }, isCorrect ? 250 : 800);
}

// クイズ終了
function endQuiz() {
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');

  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('stat-correct').textContent = `${totalCorrect} / ${totalAnswered}`;
  
  const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
  document.getElementById('stat-maxcombo').textContent = maxCombo;

  const reviewContainer = document.getElementById('review-container');
  const reviewList = document.getElementById('review-list');
  
  if (wrongList.length > 0) {
    reviewContainer.classList.remove('hidden');
    reviewList.innerHTML = wrongList.map(item => `
      <div class="review-item">
        <span class="review-word">${item[1]}</span>
        <span class="review-meaning">${item[2]}</span>
      </div>
    `).join('');
  } else {
    reviewContainer.classList.add('hidden');
  }
}

// 再挑戦ボタン
document.getElementById('restart-btn').addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

// 配列シャッフル関数
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// 初期化実行
initSelects();
</script>
